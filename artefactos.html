<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archivo Blindado • Refractor • Artefactos</title>
    <meta name="description" content="Archivo Blindado es una acción dirigida a recuperar, preservar y difundir publicaciones anarquistas en riesgo de desaparición y olvido. Se manifiesta espectralmente como un búnker de silicio, una estructura blindada virtual independiente y autosustentada.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://archivoblindado.org/artefactos.html">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Archivo Blindado • Refractor • Artefactos">
    <meta property="og:description" content="Archivo Blindado es una acción dirigida a recuperar, preservar y difundir publicaciones anarquistas en riesgo de desaparición y olvido. Se manifiesta espectralmente como un búnker de silicio, una estructura blindada virtual independiente y autosustentada.">
    <meta property="og:image" content="https://archivoblindado.org/images/Favicon_64_64.png">
    <meta property="og:url" content="https://archivoblindado.org/artefactos.html">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Archivo Blindado • Refractor • Artefactos">
    <meta name="twitter:description" content="Archivo Blindado es una acción dirigida a recuperar, preservar y difundir publicaciones anarquistas en riesgo de desaparición y olvido. Se manifiesta espectralmente como un búnker de silicio, una estructura blindada virtual independiente y autosustentada.">
    <meta name="twitter:image" content="https://archivoblindado.org/images/Favicon_64_64.png">

    <link rel="icon" type="image/png" sizes="16x16" href="images/Favicon_16_16.png?v=1">
    <link rel="icon" type="image/png" sizes="32x32" href="images/Favicon_32_32.png?v=1">
    <link rel="icon" type="image/png" sizes="64x64" href="images/Favicon_64_64.png?v=1">
    <link rel="shortcut icon" href="images/Favicon_32_32.png?v=1">
    <link rel="stylesheet" href="./styles.css?v=13">
    <script>
        window.goatcounter = {
            path: function(p) { 
                return window.location.pathname + window.location.search; 
            }
        }
    </script>
    <script data-goatcounter="https://archivoblindado.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>
</head>
<body>
    <h1 class="visually-hidden">Artefactos y Posters - Archivo Blindado</h1>
    <div class="site-wrapper page-firmas">
        <app-header></app-header>

        <div class="site-content">
            <!-- 2. HERO: Copia exacta del hero de firmas.html -->
            <section class="hero-firmas">
                <div class="container">
                    <img src="./images/Vector.svg" alt="REFRACTOR" class="hero-logo-img">
                    <div class="hero-subtitle" id="heroSubtitle">Artefactos | 00</div>
                </div>
            </section>

            <!-- 3. INTRO: Presentación de artefactos -->
            <section class="section-intro-artefactos">
                <div class="container">
                    <div class="intro-artefactos-wrapper">
                        <div class="intro-image">
                            <img src="./images/Ladron.svg" alt="" class="ladron-img">
                        </div>
                        <div class="intro-text">
                            <p class="intro-text-p">
                                Muestra, no antológica ni definitiva, de los <span class="highlight">restos insepultos y los vestigios materiales</span> generados alrededor de Refractor a modo de mapa fragmentado, onírico y espectral.
                            </p>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 4. ARTEFACTOS: Rejilla dinámica desde publicacion.json (sobre fondo blanco) -->
            <section class="section-artefactos">
                <div class="container">
                    <section class="pub-grid" id="artefactGrid">
                        <!-- Cargados dinámicamente -->
                    </section>
                </div>
            </section>
        </div>

        <!-- 5. QUOTE: El quote de siempre -->
        <app-quote></app-quote>

        <!-- 6. FOOTER: El footer de siempre -->
        <app-footer></app-footer>
    </div>

    <pdf-viewer></pdf-viewer>

    <script src="./js/components.js?v=16"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('artefactGrid');
            try {
                const response = await fetch('./data/publicacion.json');
                const data = await response.json();
                const artefactos = data.artefactos || [];
                
                // Actualizar hero subtitle
                const heroSubtitle = document.getElementById('heroSubtitle');
                if (heroSubtitle) {
                    heroSubtitle.textContent = `Artefactos | ${artefactos.length.toString().padStart(2, '0')}`;
                }

                artefactos.forEach(art => {
                    const card = document.createElement('artefact-card');
                    card.setAttribute('title', art.titulo);
                    card.setAttribute('description', art.descripcion);
                    card.setAttribute('image', `./${art.image_url}`);
                    card.setAttribute('pdf-url', `./${art.file_url}`);
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error('Error al cargar los artefactos:', error);
            }
        });
    </script>
</body>
</html>
