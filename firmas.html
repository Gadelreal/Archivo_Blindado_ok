<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Archivo Blindado - Firmas</title>
    <link rel="stylesheet" href="./styles.css?v=2">
</head>
<body>
    <div class="site-wrapper page-firmas">
        <app-header></app-header>

        <div class="site-content">
            <!-- HERO -->
            <section class="hero-firmas">
                <div class="container">
                    <img src="./images/Vector.svg" alt="REFRACTOR" class="hero-logo-img">
                    <div class="hero-subtitle" id="heroSubtitle">Firmas | Cargando...</div>
                </div>
            </section>

            <!-- FILTERS -->
            <section class="section-filters">
                <div class="filters-container">
                    <div class="filters-row">
                        <!-- Selector de Autor -->
                        <div class="filter-group">
                            <label class="filter-label">Selecciona firma <span>*</span></label>
                            <div class="search-wrapper download-wrapper" id="authorSearchWrapper">
                                <div class="search-input-container">
                                    <img src="./images/ico_search.svg" class="search-icon-left" alt="">
                                    <input type="text" class="search-input" id="authorInput" placeholder="Buscar autor...">
                                </div>
                                <div class="dropdown-menu search-dropdown" id="authorDropdown">
                                    <!-- Options injected here -->
                                </div>
                            </div>
                        </div>

                        <!-- Selector de Número -->
                        <div class="filter-group">
                            <label class="filter-label">Selecciona número</label>
                            <div class="custom-dropdown-container download-wrapper" id="issueDropdownWrapper">
                                <div class="selector-trigger" id="issueTrigger">
                                    <span id="issueTriggerText">Todos</span>
                                    <img src="./images/ico_chevron-down.svg" class="chevron" alt="">
                                </div>
                                <div class="dropdown-menu issue-dropdown" id="issueDropdown">
                                    <div class="dropdown-item option-issue" data-value="todos">Todos</div>
                                    <!-- Numbers injected here -->
                                </div>
                            </div>
                        </div>

                        <!-- Botón Ver Artículos -->
                        <button class="btn-ficha-red" id="btnVerArticulos" disabled>
                            Ver artículos <img src="./images/ico_search.svg" style="filter: brightness(0) invert(1); width: 16px;" alt="" class="btn-icon">
                        </button>
                    </div>

                    <!-- Firmas Destacadas -->
                    <div class="featured-firmas" id="featuredFirmas">
                        <span class="featured-label">Firmas destacadas:</span>
                        <!-- Pills injected here -->
                    </div>
                </div>
            </section>

            <!-- RESULTS -->
            <section class="section-results">
                <div class="results-container" id="resultsContainer">
                    <!-- Artículos inyectados aquí -->
                </div>
                <div class="results-empty" id="resultsEmpty">
                    No se han encontrado artículos para la selección actual.
                </div>
            </section>
        </div>

        <app-quote 
            text="Todo pasa, la nada quedará, la nada creadora. Los refractarios vamos a por el todo porque no aspiramos a nada." 
            highlight="¡Para otros la revolución!"
            text-post="Para nosotros la gimnasia revolucionaria. El futuro se ve tan negro que nadie duda que será nuestro."
            author="Victor Nero">
        </app-quote>

        <app-footer></app-footer>
    </div>

    <pdf-viewer></pdf-viewer>

    <script src="./js/vendor/pdf.min.js"></script>
    <script src="./js/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const authorInput = document.getElementById('authorInput');
            const authorDropdown = document.getElementById('authorDropdown');
            const authorSearchWrapper = document.getElementById('authorSearchWrapper');
            
            const issueDropdownWrapper = document.getElementById('issueDropdownWrapper');
            const issueTrigger = document.getElementById('issueTrigger');
            const issueTriggerText = document.getElementById('issueTriggerText');
            const issueDropdown = document.getElementById('issueDropdown');
            
            const btnVerArticulos = document.getElementById('btnVerArticulos');
            const featuredFirmas = document.getElementById('featuredFirmas');
            const resultsContainer = document.getElementById('resultsContainer');
            const resultsEmpty = document.getElementById('resultsEmpty');
            const heroSubtitle = document.getElementById('heroSubtitle');

            let allArticulos = [];
            let allAutores = [];
            let allPublicaciones = [];
            let selectedAuthorId = null;
            let selectedIssue = 'todos';

            // Load Data
            async function loadData() {
                try {
                    const [resArticulos, resPublicacion] = await Promise.all([
                        fetch('./data/articulos.json'),
                        fetch('./data/publicacion.json')
                    ]);
                    allArticulos = await resArticulos.json();
                    const publicacionData = await resPublicacion.json();
                    allAutores = publicacionData.autores || [];
                    allPublicaciones = publicacionData.ejemplares || [];

                    processAuthors();
                    populateNumbers();
                    renderFeatured();
                    
                    const firmasText = allAutores.length === 1 ? 'firma' : 'firmas';
                    heroSubtitle.textContent = `Firmas | ${allAutores.length} ${firmasText}`;
                } catch (error) {
                    console.error('Error loading data:', error);
                }
            }

            function processAuthors() {
                allAutores.forEach(author => {
                    author.count = allArticulos.filter(a => a.autor_id === author.id).length;
                });
                allAutores.sort((a, b) => a.nombre.localeCompare(b.nombre));
                renderAuthorDropdown(allAutores);
            }

            function renderAuthorDropdown(authorsList) {
                authorDropdown.innerHTML = '';
                authorsList.forEach(author => {
                    const div = document.createElement('div');
                    div.className = 'dropdown-item dropdown-option';
                    div.dataset.id = author.id;
                    div.dataset.name = author.nombre;
                    div.innerHTML = `${author.nombre} <span class="option-count">${author.count}</span>`;
                    div.onclick = () => selectAuthor(author.id, author.nombre);
                    authorDropdown.appendChild(div);
                });
            }

            function populateNumbers() {
                issueDropdown.innerHTML = '';
                
                // Add "Todos" option
                const todosDiv = document.createElement('div');
                todosDiv.className = 'dropdown-item option-issue';
                todosDiv.dataset.value = 'todos';
                todosDiv.textContent = 'Todos';
                todosDiv.onclick = () => selectIssue('todos');
                if (selectedIssue === 'todos') todosDiv.classList.add('selected');
                issueDropdown.appendChild(todosDiv);

                let filteredForNumbers = allArticulos;
                if (selectedAuthorId) {
                    filteredForNumbers = allArticulos.filter(a => a.autor_id === selectedAuthorId);
                }

                const numbers = [...new Set(filteredForNumbers.map(a => a.numero))].sort();
                numbers.forEach(n => {
                    const div = document.createElement('div');
                    div.className = 'dropdown-item option-issue';
                    div.dataset.value = n;
                    div.textContent = n;
                    div.onclick = () => selectIssue(n);
                    if (selectedIssue === n) div.classList.add('selected');
                    issueDropdown.appendChild(div);
                });
            }

            function selectIssue(val) {
                selectedIssue = val;
                issueTriggerText.textContent = val === 'todos' ? 'Todos' : val;
                issueDropdownWrapper.classList.remove('is-open');
                
                // Highlight
                issueDropdown.querySelectorAll('.option-issue').forEach(opt => {
                    if (opt.dataset.value === val) opt.classList.add('selected');
                    else opt.classList.remove('selected');
                });
            }

            function renderFeatured() {
                const topAuthors = [...allAutores]
                    .filter(a => a.count > 0)
                    .sort((a, b) => b.count - a.count)
                    .slice(0, 6);

                topAuthors.forEach(author => {
                    const pill = document.createElement('div');
                    pill.className = 'firma-pill';
                    pill.innerHTML = `${author.nombre} <span>${author.count}</span>`;
                    pill.onclick = () => selectAuthor(author.id, author.nombre, true);
                    featuredFirmas.appendChild(pill);
                });
            }

            function selectAuthor(id, name, autoClick = false) {
                selectedAuthorId = id;
                authorInput.value = name;
                authorSearchWrapper.classList.remove('is-open');
                btnVerArticulos.disabled = false;
                
                selectedIssue = 'todos';
                populateNumbers();
                selectIssue('todos');

                const options = authorDropdown.querySelectorAll('.dropdown-option');
                options.forEach(opt => {
                    if (opt.dataset.id === id) opt.classList.add('selected');
                    else opt.classList.remove('selected');
                });

                if (autoClick) {
                    renderResults();
                }
            }

            // Interactions
            authorInput.onfocus = () => {
                authorSearchWrapper.classList.add('is-open');
            };

            authorInput.oninput = (e) => {
                const val = e.target.value.toLowerCase();
                const filtered = allAutores.filter(a => a.nombre.toLowerCase().includes(val));
                renderAuthorDropdown(filtered);
                authorSearchWrapper.classList.add('is-open');
                if (!val) {
                    selectedAuthorId = null;
                    btnVerArticulos.disabled = true;
                }
            };

            issueTrigger.onclick = (e) => {
                e.stopPropagation();
                issueDropdownWrapper.classList.toggle('is-open');
                authorSearchWrapper.classList.remove('is-open');
            };

            document.addEventListener('click', (e) => {
                if (!authorSearchWrapper.contains(e.target)) {
                    authorSearchWrapper.classList.remove('is-open');
                }
                if (!issueDropdownWrapper.contains(e.target)) {
                    issueDropdownWrapper.classList.remove('is-open');
                }
            });

            btnVerArticulos.onclick = () => renderResults();

            function renderResults() {
                let filtered = allArticulos.filter(a => a.autor_id === selectedAuthorId);
                
                if (selectedIssue !== 'todos') {
                    filtered = filtered.filter(a => a.numero === selectedIssue);
                }

                if (filtered.length === 0) {
                    resultsContainer.innerHTML = '';
                    resultsEmpty.style.display = 'block';
                    return;
                }

                resultsEmpty.style.display = 'none';
                const author = allAutores.find(a => a.id === selectedAuthorId);
                const issues = [...new Set(filtered.map(a => a.numero))].sort();
                
                const issuesText = issues.length === 1 ? 'número' : 'números';
                const articlesText = filtered.length === 1 ? 'artículo' : 'artículos';

                resultsContainer.innerHTML = `
                    <div class="articulos-header">
                        <div class="articulos-header-left">
                            <h2 class="articulos-title">${author.nombre.toUpperCase()}</h2>
                            <p class="articulos-meta">${issues.length} ${issuesText} | ${filtered.length} ${articlesText}</p>
                        </div>
                    </div>
                `;

                const groups = {};
                filtered.forEach(art => {
                    const key = `REFRACTOR ${art.numero} | Página ${art.pagina}`;
                    if (!groups[key]) groups[key] = [];
                    groups[key].push(art);
                });

                Object.keys(groups).forEach((key, index) => {
                    const arts = groups[key];
                    const firstArt = arts[0];
                    const pdfId = `P_R_${firstArt.numero}_${firstArt.pagina.toString().padStart(2, '0')}`;
                    const pdfUrl = `./pdf/${pdfId}.pdf`;

                    const artsText = arts.length === 1 ? 'artículo' : 'artículos';
                    const accordion = document.createElement('app-accordion');
                    accordion.setAttribute('title', `${key} | ${arts.length} ${artsText}`);
                    if (index === 0) accordion.setAttribute('open', '');

                    let articlesHtml = '';

                    arts.forEach((art, i) => {
                        articlesHtml += `
                            <article class="pub-article">
                                <h3 class="art-title">${art.titulo}</h3>
                                <div class="art-body">
                                    ${art.contenido.split('\n\n').map(p => {
                                        const cleanP = p.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                                                        .replace(/\*(.*?)\*/g, '<em>$1</em>');
                                        return `<p class="art-paragraph">${cleanP}</p>`;
                                    }).join('')}
                                </div>
                                <div class="art-signature">
                                    <p class="art-signature-intro">por los refractarios,</p>
                                    <p class="art-signature-name"><strong>${author.nombre}${art.lugar_fecha_publicacion ? `, ${art.lugar_fecha_publicacion.split(',')[0].trim()}` : ''}</strong></p>
                                    <p class="art-signature-date">${art.lugar_fecha_publicacion && art.lugar_fecha_publicacion.includes(',') ? art.lugar_fecha_publicacion.split(',')[1].trim() : ''}</p>
                                </div>
                                <div class="art-tag-footer" style="padding-top: 32px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;">
                                    <div class="author-tag">Refractor ${art.numero}</div>
                                    <div class="author-tag">${author.nombre}</div>
                                    <button class="btn-text-red btn-ver-pdf" data-url="${pdfUrl}">
                                        Ver artículo en PDF 
                                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                        </svg>
                                    </button>
                                </div>
                            </article>
                            ${i < arts.length - 1 ? '<div class="articles-separator"></div>' : ''}
                        `;
                    });

                    accordion.innerHTML = articlesHtml;
                    resultsContainer.appendChild(accordion);

                    const btnsPdf = accordion.querySelectorAll('.btn-ver-pdf');
                    btnsPdf.forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            const viewer = document.querySelector('pdf-viewer');
                            viewer.open(e.currentTarget.dataset.url);
                        });
                    });
                });


            }

            await loadData();
        });
    </script>
</body>
</html>
