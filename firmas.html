<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Archivo Blindado - Firmas</title>
    <link rel="stylesheet" href="./styles.css?v=2">
    <style>
        /* Estilos específicos para esta página que no están en styles.css */
        .hero-firmas {
            background-image: url('./images/Base_BG_Paginas_varias.png');
            background-size: cover;
            background-position: center;
            padding: 120px 80px 60px 80px;
            color: var(--text-inverse);
            position: relative;
        }
        
        .hero-firmas::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40px;
            background-image: url('./images/Masking Tape_01_tablet.png'); /* Usando uno de los tapes como separador o similar si aplica */
            background-size: 100% 100%;
            display: none; /* Ajustar según diseño */
        }

        .hero-firmas .hero-logo-img {
            max-width: 380px;
            margin-bottom: 8px;
        }

        .hero-firmas .hero-subtitle {
            font-size: 24px;
            font-weight: 400;
            color: var(--text-inverse);
            font-family: var(--font-base);
        }

        .section-filters {
            background-color: #F9FAFB;
            padding: 40px 80px;
            border-bottom: 1px solid #EAECF0;
        }

        .filters-container {
            max-width: 1440px;
            margin: 0 auto;
        }

        .filters-row {
            display: flex;
            gap: 24px;
            align-items: flex-end;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-label {
            font-size: 14px;
            font-weight: 600;
            color: #344054;
        }

        .filter-label span {
            color: #D92D20;
        }

        .search-wrapper {
            position: relative;
            width: 380px;
        }

        .search-input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-icon-left {
            position: absolute;
            left: 12px;
            width: 20px;
            height: 20px;
            opacity: 0.5;
        }

        .search-input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border: 1px solid #D0D5DD;
            border-radius: 0;
            font-family: var(--font-base);
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            border-color: var(--bg-red);
        }

        .search-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            width: 100%;
            background: white;
            border: 1px solid #D0D5DD;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 1000;
            max-height: 300px;
            overflow-y: auto;
            display: none;
        }

        .search-dropdown.is-open {
            display: block;
        }

        .dropdown-option {
            padding: 10px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 16px;
            color: #1D2939;
        }

        .dropdown-option:hover {
            background-color: #F9FAFB;
        }

        .dropdown-option.selected {
            background-color: #F2F4F7;
        }

        .dropdown-option .option-count {
            font-size: 14px;
            color: #667085;
        }

        .select-issue {
            width: 180px;
            padding: 12px 16px;
            border: 1px solid #D0D5DD;
            border-radius: 0;
            font-family: var(--font-base);
            font-size: 16px;
            background-color: white;
            cursor: pointer;
            appearance: none;
            background-image: url('./images/ico_chevron-down.svg');
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
        }

        .btn-ver-articulos {
            background-color: var(--bg-red);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .btn-ver-articulos:disabled {
            background-color: #F2F4F7;
            color: #98A2B3;
            cursor: not-allowed;
        }

        .featured-firmas {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .featured-label {
            font-size: 14px;
            color: #475467;
            margin-right: 4px;
        }

        .firma-pill {
            padding: 4px 12px;
            border: 1px solid #D0D5DD;
            font-size: 12px;
            font-weight: 600;
            color: #344054;
            cursor: pointer;
            display: flex;
            gap: 8px;
            align-items: center;
            background: white;
        }

        .firma-pill:hover {
            border-color: var(--bg-red);
            color: var(--bg-red);
        }

        .firma-pill span {
            color: #667085;
            font-weight: 400;
        }

        .section-results {
            padding: 60px 80px;
            min-height: 400px;
        }

        .results-container {
            max-width: 1440px;
            margin: 0 auto;
        }

        .results-empty {
            text-align: center;
            padding: 80px 0;
            color: #667085;
            display: none;
        }

        /* Reutilización de estilos de ficha_numero.html */
        .articulos-header {
            margin-bottom: 40px;
        }
        
        .articulos-title {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .articulos-meta {
            font-size: 16px;
            color: #667085;
        }

        @media (max-width: 1024px) {
            .hero-firmas {
                padding: 100px 32px 40px 32px;
            }
            .section-filters, .section-results {
                padding: 40px 32px;
            }
            .search-wrapper {
                width: 100%;
            }
            .filters-row {
                flex-direction: column;
                align-items: stretch;
            }
            .select-issue {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="site-wrapper">
        <app-header></app-header>

        <div class="site-content">
            <!-- HERO -->
            <section class="hero-firmas">
                <div class="container">
                    <img src="./images/Vector.svg" alt="REFRACTOR" class="hero-logo-img">
                    <div class="hero-subtitle" id="heroSubtitle">Firmas | Cargando...</div>
                </div>
            </section>

            <!-- FILTERS -->
            <section class="section-filters">
                <div class="filters-container">
                    <div class="filters-row">
                        <!-- Selector de Autor -->
                        <div class="filter-group">
                            <label class="filter-label">Selecciona firma <span>*</span></label>
                            <div class="search-wrapper" id="authorSearchWrapper">
                                <div class="search-input-container">
                                    <img src="./images/ico_zoom-in.svg" class="search-icon-left" alt="">
                                    <input type="text" class="search-input" id="authorInput" placeholder="Buscar autor...">
                                </div>
                                <div class="search-dropdown" id="authorDropdown">
                                    <!-- Options injected here -->
                                </div>
                            </div>
                        </div>

                        <!-- Selector de Número -->
                        <div class="filter-group">
                            <label class="filter-label">Selecciona número</label>
                            <select class="select-issue" id="issueSelect">
                                <option value="todos">Todos</option>
                                <!-- Numbers injected here -->
                            </select>
                        </div>

                        <!-- Botón Ver Artículos -->
                        <button class="btn-ver-articulos" id="btnVerArticulos" disabled>
                            Ver artículos <img src="./images/ico_zoom-in.svg" style="filter: brightness(0) invert(1); width: 16px;" alt="">
                        </button>
                    </div>

                    <!-- Firmas Destacadas -->
                    <div class="featured-firmas" id="featuredFirmas">
                        <span class="featured-label">Firmas destacadas:</span>
                        <!-- Pills injected here -->
                    </div>
                </div>
            </section>

            <!-- RESULTS -->
            <section class="section-results">
                <div class="results-container" id="resultsContainer">
                    <!-- Artículos inyectados aquí -->
                </div>
                <div class="results-empty" id="resultsEmpty">
                    No se han encontrado artículos para la selección actual.
                </div>
            </section>
        </div>

        <app-quote 
            text="Todo pasa, la nada quedará, la nada creadora. Los refractarios vamos a por el todo porque no aspiramos a nada." 
            highlight="¡Para otros la revolución!"
            text-post="Para nosotros la gimnasia revolucionaria. El futuro se ve tan negro que nadie duda que será nuestro."
            author="Victor Nero">
        </app-quote>

        <app-footer></app-footer>
    </div>

    <pdf-viewer></pdf-viewer>

    <script src="./js/vendor/pdf.min.js"></script>
    <script src="./js/components.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const authorInput = document.getElementById('authorInput');
            const authorDropdown = document.getElementById('authorDropdown');
            const authorSearchWrapper = document.getElementById('authorSearchWrapper');
            const issueSelect = document.getElementById('issueSelect');
            const btnVerArticulos = document.getElementById('btnVerArticulos');
            const featuredFirmas = document.getElementById('featuredFirmas');
            const resultsContainer = document.getElementById('resultsContainer');
            const resultsEmpty = document.getElementById('resultsEmpty');
            const heroSubtitle = document.getElementById('heroSubtitle');

            let allArticulos = [];
            let allAutores = [];
            let allPublicaciones = [];
            let selectedAuthorId = null;

            // Load Data
            async function loadData() {
                try {
                    const [resArticulos, resPublicacion] = await Promise.all([
                        fetch('./data/articulos.json'),
                        fetch('./data/publicacion.json')
                    ]);
                    allArticulos = await resArticulos.json();
                    const publicacionData = await resPublicacion.json();
                    allAutores = publicacionData.autores || [];
                    allPublicaciones = publicacionData.ejemplares || [];

                    processAuthors();
                    populateNumbers();
                    renderFeatured();
                    
                    heroSubtitle.textContent = `Firmas | ${allAutores.length} firmas`;
                } catch (error) {
                    console.error('Error loading data:', error);
                }
            }

            function processAuthors() {
                // Calculate counts
                allAutores.forEach(author => {
                    author.count = allArticulos.filter(a => a.autor_id === author.id).length;
                });
                
                // Sort by name
                allAutores.sort((a, b) => a.nombre.localeCompare(b.nombre));
                
                renderAuthorDropdown(allAutores);
            }

            function renderAuthorDropdown(authorsList) {
                authorDropdown.innerHTML = '';
                authorsList.forEach(author => {
                    const div = document.createElement('div');
                    div.className = 'dropdown-option';
                    div.dataset.id = author.id;
                    div.dataset.name = author.nombre;
                    div.innerHTML = `${author.nombre} <span class="option-count">${author.count}</span>`;
                    div.onclick = () => selectAuthor(author.id, author.nombre);
                    authorDropdown.appendChild(div);
                });
            }

            function populateNumbers() {
                const numbers = [...new Set(allArticulos.map(a => a.numero))].sort();
                numbers.forEach(n => {
                    const opt = document.createElement('option');
                    opt.value = n;
                    opt.textContent = n;
                    issueSelect.appendChild(opt);
                });
            }

            function renderFeatured() {
                // Pick top 6 or first 6 with articles
                const topAuthors = [...allAutores]
                    .filter(a => a.count > 0)
                    .sort((a, b) => b.count - a.count)
                    .slice(0, 6);

                topAuthors.forEach(author => {
                    const pill = document.createElement('div');
                    pill.className = 'firma-pill';
                    pill.innerHTML = `${author.nombre} <span>${author.count}</span>`;
                    pill.onclick = () => selectAuthor(author.id, author.nombre, true);
                    featuredFirmas.appendChild(pill);
                });
            }

            function selectAuthor(id, name, autoClick = false) {
                selectedAuthorId = id;
                authorInput.value = name;
                authorDropdown.classList.remove('is-open');
                btnVerArticulos.disabled = false;
                
                // Highlight selection
                const options = authorDropdown.querySelectorAll('.dropdown-option');
                options.forEach(opt => {
                    if (opt.dataset.id === id) opt.classList.add('selected');
                    else opt.classList.remove('selected');
                });

                if (autoClick) {
                    renderResults();
                }
            }

            // Input interactions
            authorInput.onfocus = () => {
                authorDropdown.classList.add('is-open');
            };

            authorInput.oninput = (e) => {
                const val = e.target.value.toLowerCase();
                const filtered = allAutores.filter(a => a.nombre.toLowerCase().includes(val));
                renderAuthorDropdown(filtered);
                authorDropdown.classList.add('is-open');
                
                // If input cleared, disable button
                if (!val) {
                    selectedAuthorId = null;
                    btnVerArticulos.disabled = true;
                }
            };

            // Close dropdown when clicking outside
            document.addEventListener('click', (e) => {
                if (!authorSearchWrapper.contains(e.target)) {
                    authorDropdown.classList.remove('is-open');
                }
            });

            btnVerArticulos.onclick = () => renderResults();

            function renderResults() {
                const numFilter = issueSelect.value;
                let filtered = allArticulos.filter(a => a.autor_id === selectedAuthorId);
                
                if (numFilter !== 'todos') {
                    filtered = filtered.filter(a => a.numero === numFilter);
                }

                if (filtered.length === 0) {
                    resultsContainer.innerHTML = '';
                    resultsEmpty.style.display = 'block';
                    return;
                }

                resultsEmpty.style.display = 'none';
                
                // Group by Issue and Page (similar to ficha_numero)
                // Actually, for a single author, maybe we just list them or group by Issue.
                // The Figma shows a title with the Author Name and Issue info.
                
                const author = allAutores.find(a => a.id === selectedAuthorId);
                const issues = [...new Set(filtered.map(a => a.numero))].sort();

                resultsContainer.innerHTML = `
                    <div class="articulos-header">
                        <h2 class="articulos-title">${author.nombre.toUpperCase()}</h2>
                        <p class="articulos-meta">${issues.length} números | ${filtered.length} artículos</p>
                    </div>
                `;

                // Render articles using app-accordion (one per Page or per Issue?)
                // Assuming grouping by Issue/Page like in ficha_numero
                const groups = {};
                filtered.forEach(art => {
                    const key = `REFRACTOR ${art.numero} | Página ${art.pagina}`;
                    if (!groups[key]) groups[key] = [];
                    groups[key].push(art);
                });

                Object.keys(groups).forEach((key, index) => {
                    const arts = groups[key];
                    const firstArt = arts[0];
                    const pdfId = `P_R_${firstArt.numero}_${firstArt.pagina.toString().padStart(2, '0')}`;
                    const pdfUrl = `./pdf/${pdfId}.pdf`;

                    const accordion = document.createElement('app-accordion');
                    accordion.setAttribute('title', `${key} | ${arts.length} artículos`);
                    if (index === 0) accordion.setAttribute('open', '');

                    let articlesHtml = `
                        <div class="accordion-top-actions" style="padding: 0 24px 16px 24px;">
                            <button class="btn-ficha-outline btn-ver-pdf" data-url="${pdfUrl}" style="padding: 10px 20px; font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer;">
                                Ver página en PDF
                                <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M17.5 17.5L13.875 13.875M9.16667 6.66667V11.6667M6.66667 9.16667H11.6667M15.8333 9.16667C15.8333 12.8486 12.8486 15.8333 9.16667 15.8333C5.48477 15.8333 2.5 12.8486 2.5 9.16667C2.5 5.48477 5.48477 2.5 9.16667 2.5C12.8486 2.5 15.8333 5.48477 15.8333 9.16667Z" stroke="currentColor" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                        </div>
                    `;

                    arts.forEach((art, i) => {
                        articlesHtml += `
                            <article class="pub-article">
                                <h3 class="art-title">${art.titulo}</h3>
                                <div class="art-body">
                                    ${art.contenido.split('\n\n').map(p => {
                                        const cleanP = p.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                                                        .replace(/\*(.*?)\*/g, '<em>$1</em>');
                                        return `<p class="art-paragraph">${cleanP}</p>`;
                                    }).join('')}
                                </div>
                                <div class="art-signature">
                                    <p class="art-signature-intro">por los refractarios,</p>
                                    <p class="art-signature-name">${art.autor}, ${art.lugar_fecha_publicacion}</p>
                                </div>
                                <div class="art-tag-footer" style="padding-bottom: 0;">
                                    <div class="author-tag">${art.autor}</div>
                                </div>
                            </article>
                            ${i < arts.length - 1 ? '<div class="articles-separator"></div>' : ''}
                        `;
                    });

                    accordion.innerHTML = articlesHtml;
                    resultsContainer.appendChild(accordion);

                    // Add click listener to the newly created button
                    const btnPdf = accordion.querySelector('.btn-ver-pdf');
                    btnPdf.addEventListener('click', (e) => {
                        const viewer = document.querySelector('pdf-viewer');
                        viewer.open(e.currentTarget.dataset.url);
                    });
                });

                // Scroll to results
                setTimeout(() => {
                    resultsContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }, 100);
            }

            await loadData();
        });
    </script>
</body>
</html>
