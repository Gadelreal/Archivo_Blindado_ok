<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Archivo Blindado - Ficha de Número</title>
    <link rel="stylesheet" href="./styles.css?v=3">
</head>
<body>
    <div class="site-wrapper">
        <app-header></app-header>

        <main class="main-content">
            <!-- SECCIÓN HERO -->
            <section class="hero-ficha">
                <div class="hero-brand">
                    <img src="./images/Vector.svg" alt="REFRACTOR" class="hero-logo-img">
                    <div class="hero-date">1998 • 2000</div>
                </div>

                <div class="hero-nav">
                    <!-- Botón Independiente: Flecha -->
                    <button class="hero-nav-btn hero-nav-item">
                        <img src="./images/ico_arrow-narrow-left.svg" alt="" class="hero-nav-icon">
                    </button>

                    <!-- Grupo de 2 Botones: Anterior y Siguiente -->
                    <div class="hero-nav-group">
                        <button class="hero-nav-btn">Anterior</button>
                        <button class="hero-nav-btn">Siguiente</button>
                    </div>

                    <!-- Botón Independiente: Selector -->
                    <div class="hero-nav-selector hero-nav-item">
                        <span>1</span>
                        <img src="./images/ico_chevron-down.svg" alt="" class="hero-nav-chevron">
                    </div>
                </div>
            </section>

            <!-- SECCIÓN FICHA -->
            <section class="section-ficha">
                <div class="container container-ficha">
                    <div class="ficha-row">
                        <!-- Portada de la publicación -->
                        <div class="ficha-col-image">
                            <div class="pub-card-ficha">
                                <img src="./images/Placeholder Refractor.jpg" alt="REFRACTOR 01" class="pub-cover-ficha">
                                <img src="./images/Onmouse_2.svg" alt="" class="pub-hover-icon-ficha">
                            </div>
                        </div>

                        <!-- Información de la ficha -->
                        <div class="ficha-col-info">
                            <div class="ficha-content-block">
                                <h1 class="ficha-title">REFRACTOR 01</h1>
                                <p class="ficha-subtitle">14 de marzo de 1998 • 400 pts. • Tirada: 1.500 ejemplares</p>
                                
                                <div class="ficha-actions-row">
                                    <button class="btn-ficha-outline">
                                        <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                        Ver detalle
                                    </button>
                                    <button class="btn-ficha-red">
                                        <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                                        Descargar
                                        <svg class="btn-icon-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                                    </button>
                                </div>

                                <div class="ficha-pages-preview">
                                    <div class="page-preview-box">
                                        <span class="preview-num">1</span>
                                        <svg class="preview-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                    </div>
                                    <div class="page-preview-box active">
                                        <span class="preview-num">2</span>
                                        <svg class="preview-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                                    </div>
                                </div>

                                <div class="ficha-bottom-meta">
                                    1 página • Tamaño: 135 x 124 cm.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- SECCIÓN ARTÍCULOS -->
            <section class="placeholder-section placeholder-articulos">
                ARTÍCULOS (DIVIDIDOS POR PÁGINAS)
            </section>

            <!-- SECCIÓN MINIFICHA -->
            <section class="placeholder-section placeholder-minificha">
                MINIFICHA
            </section>
        </main>

        <app-quote 
            text="Todo pasa, la nada quedará, la nada creadora. Los refractarios vamos a por el todo porque no aspiramos a nada." 
            highlight="¡Para otros la revolución!"
            text-post="Para nosotros la gimnasia revolucionaria. El futuro se ve tan negro que nadie duda que será nuestro."
            author="Victor Nero">
        </app-quote>

        <app-footer></app-footer>
    </div> <!-- End site-wrapper -->

    <script src="./js/components.js"></script>
</body>
</html>
