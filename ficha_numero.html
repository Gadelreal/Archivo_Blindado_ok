<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">El Archivo Blindado - Refractor</title>
    <link rel="icon" type="image/png" sizes="16x16" href="images/Favicon_16_16.png?v=1">
    <link rel="icon" type="image/png" sizes="32x32" href="images/Favicon_32_32.png?v=1">
    <link rel="icon" type="image/png" sizes="64x64" href="images/Favicon_64_64.png?v=1">
    <link rel="shortcut icon" href="images/Favicon_32_32.png?v=1">
    <link rel="stylesheet" href="./styles.css?v=12">
</head>
<body>
    <div class="site-wrapper">
        <app-header></app-header>

        <div class="mural-wrapper">
            <!-- SECCIÓN HERO -->
            <section class="hero-ficha">
                <div class="hero-brand">
                    <img src="./images/Vector.svg" alt="REFRACTOR" class="hero-logo-img">
                    <div class="hero-date">1998 • 2000</div>
                </div>

                <div class="hero-nav">
                    <!-- Botón Independiente: Flecha -->
                    <a href="./index.html" class="hero-nav-btn hero-nav-item">
                        <img src="./images/ico_arrow-narrow-left.svg" alt="" class="hero-nav-icon">
                    </a>

                    <!-- Grupo de 2 Botones: Anterior y Siguiente -->
                    <div class="hero-nav-group">
                        <button class="hero-nav-btn">Anterior</button>
                        <button class="hero-nav-btn">Siguiente</button>
                    </div>

                    <!-- Botón Independiente: Selector -->
                    <issue-selector id="issueSelectorComponent"></issue-selector>
                </div>
            </section>

            <!-- SECCIÓN FICHA -->
            <section class="section-ficha">
                <div class="container container-ficha">
                    <div class="ficha-row">
                        <!-- Portada de la publicación -->
                        <div class="ficha-col-image">
                            <div class="pub-card-ficha" id="mainThumbWrapper">
                                <img src="" alt="" class="pub-cover-ficha" id="mainCoverImg">
                                <img src="./images/Onmouse_2.svg" alt="" class="pub-hover-icon-ficha">
                            </div>
                        </div>

                        <!-- Información de la ficha -->
                        <div class="ficha-col-info">
                            <div class="ficha-content-block">
                                <h1 class="ficha-title" id="fichaTitle">Cargando...</h1>
                                <p class="ficha-subtitle" id="fichaSubtitle"></p>
                                
                                <div class="ficha-actions-row">
                                    <button class="btn-ficha-outline" id="btnMainDetail">
                                        <span class="btn-text">Ver detalle</span>
                                        <svg class="btn-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M17.5 17.5L13.875 13.875M9.16667 6.66667V11.6667M6.66667 9.16667H11.6667M15.8333 9.16667C15.8333 12.8486 12.8486 15.8333 9.16667 15.8333C5.48477 15.8333 2.5 12.8486 2.5 9.16667C2.5 5.48477 5.48477 2.5 9.16667 2.5C12.8486 2.5 15.8333 5.48477 15.8333 9.16667Z" stroke="currentColor" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </button>
                                    <download-dropdown text="Descargar" btn-class="btn-ficha-red"></download-dropdown>
                                </div>

                                <div class="ficha-pages-preview" id="fichaPagesPreview">
                                </div>

                                <div class="ficha-bottom-meta" id="fichaBottomMeta">
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- SECCIÓN ARTÍCULOS -->
            <section class="section-articulos">
                <div class="container container-articulos">
                    <div class="articulos-header">
                        <div class="articulos-header-left">
                            <h2 class="articulos-title" id="artsTitle"></h2>
                            <p class="articulos-meta" id="artsMeta"></p>
                        </div>
                        <div class="articulos-header-right">
                            <div class="author-tags-row" id="artsAuthors">
                            </div>
                        </div>
                    </div>
                    
                    <div id="accordionContainer">
                    </div>
                </div>
            </section>

            <!-- SECCIÓN MINIFICHA -->
            <section class="section-minificha">
                <div class="container container-minificha">
                    <div class="minificha-row">
                        <div class="minificha-left">
                            <div class="minificha-image-box" id="miniThumbWrapper">
                                <img src="" alt="" class="minificha-img" id="miniThumbImg">
                                <img src="./images/Onmouse_2.svg" alt="Zoom" class="minificha-zoom">
                            </div>
                            <div class="minificha-info">
                                <h3 class="minificha-title" id="miniFichaTitle"></h3>
                                <div class="minificha-btns">
                                    <div class="ficha-actions-row" style="margin-top: 0;">
                                        <button class="btn-ficha-outline" id="btnMiniDetail" style="padding: 10px 20px;">
                                            Ver detalle
                                            <svg class="btn-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                                <path d="M17.5 17.5L13.875 13.875M9.16667 6.66667V11.6667M6.66667 9.16667H11.6667M15.8333 9.16667C15.8333 12.8486 12.8486 15.8333 9.16667 15.8333C5.48477 15.8333 2.5 12.8486 2.5 9.16667C2.5 5.48477 5.48477 2.5 9.16667 2.5C12.8486 2.5 15.8333 5.48477 15.8333 9.16667Z" stroke="currentColor" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round"/>
                                            </svg>
                                        </button>
                                        <download-dropdown text="Descargar" btn-class="btn-ficha-red"></download-dropdown>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="minificha-right">
                            <div class="hero-nav">
                                <div class="hero-nav-group">
                                    <button class="hero-nav-btn" disabled>Anterior</button>
                                    <button class="hero-nav-btn" disabled>Siguiente</button>
                                </div>
                                <issue-selector id="miniIssueSelectorComponent"></issue-selector>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <app-quote 
            text="Todo pasa, la nada quedará, la nada creadora. Los refractarios vamos a por el todo porque no aspiramos a nada." 
            highlight="¡Para otros la revolución!"
            text-post="Para nosotros la gimnasia revolucionaria. El futuro se ve tan negro que nadie duda que será nuestro."
            author="Victor Nero">
        </app-quote>

        <app-footer></app-footer>
    </div> <!-- End site-wrapper -->

    <pdf-viewer></pdf-viewer>

    <script src="./js/components.js?v=7"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const viewer = document.querySelector('pdf-viewer');
            const urlParams = new URLSearchParams(window.location.search);
            const targetId = urlParams.get('id') || 'N_Refractor_01'; // Default si no se pasa id

            try {
                // Fetch JSONs
                const [resPub, resArt] = await Promise.all([
                    fetch('./data/publicacion.json'),
                    fetch('./data/articulos.json')
                ]);
                
                const pubData = await resPub.json();
                const allArticles = await resArt.json();
                
                const ejemplar = pubData.ejemplares.find(e => e.id === targetId);
                if (!ejemplar) {
                    console.error('Ejemplar no encontrado:', targetId);
                    document.getElementById('fichaTitle').textContent = 'Publicación no encontrada';
                    return;
                }

                const strNum = ejemplar.numero.toString().padStart(2, '0');
                const thumbnailPath = `./images/Miniaturas_Refractor/N_Refractor_${strNum}.jpg`;
                const titleText = `REFRACTOR ${strNum}`;
                
                // Update basic info
                document.getElementById('pageTitle').textContent = `El Archivo Blindado - ${titleText}`;
                
                document.getElementById('mainCoverImg').src = thumbnailPath;
                document.getElementById('mainCoverImg').alt = titleText;
                
                document.getElementById('fichaTitle').textContent = titleText;
                document.getElementById('fichaSubtitle').textContent = `${ejemplar.fecha_publicacion} • ${ejemplar.precio} • Tirada: ${ejemplar.tirada}`;
                
                const metaPagesText = ejemplar.paginas_procesadas === 1 ? '1 página' : `${ejemplar.paginas_procesadas} páginas`;
                document.getElementById('fichaBottomMeta').textContent = `${metaPagesText} • Tamaño: ${ejemplar.tamaño}`;

                // Update minificha
                document.getElementById('miniThumbImg').src = thumbnailPath;
                document.getElementById('miniThumbImg').alt = titleText;
                document.getElementById('miniFichaTitle').textContent = titleText;

                // Page Previews
                const previewContainer = document.getElementById('fichaPagesPreview');
                ejemplar.lista_paginas.forEach(page => {
                    const box = document.createElement('div');
                    box.className = 'page-preview-box';
                    box.innerHTML = `
                        <span class="preview-num">${page.pagina}</span>
                        <svg class="preview-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M17.5 17.5L13.875 13.875M9.16667 6.66667V11.6667M6.66667 9.16667H11.6667M15.8333 9.16667C15.8333 12.8486 12.8486 15.8333 9.16667 15.8333C5.48477 15.8333 2.5 12.8486 2.5 9.16667C2.5 5.48477 5.48477 2.5 9.16667 2.5C12.8486 2.5 15.8333 5.48477 15.8333 9.16667Z" stroke="currentColor" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    `;
                    box.addEventListener('click', () => {
                        viewer.open(`./pdf/N_Refractor_${strNum}.pdf#page=${page.pagina}`);
                    });
                    previewContainer.appendChild(box);
                });

                // Articulos Header
                document.getElementById('artsTitle').textContent = titleText;
                const artsText = ejemplar.articulos_extraidos === 1 ? '1 artículo' : `${ejemplar.articulos_extraidos} artículos`;
                document.getElementById('artsMeta').textContent = `${metaPagesText} | ${artsText}`;

                const authorsContainer = document.getElementById('artsAuthors');
                ejemplar.autores_ids.forEach(authId => {
                    const authorObj = pubData.autores.find(a => a.id === authId);
                    if (authorObj) {
                        const tag = document.createElement('div');
                        tag.className = 'author-tag';
                        tag.textContent = authorObj.nombre;
                        authorsContainer.appendChild(tag);
                    }
                });

                // Articulos Content (Accordions)
                const accordionContainer = document.getElementById('accordionContainer');
                
                // Set component values if possible
                const issueComp = document.getElementById('issueSelectorComponent');
                if (issueComp) issueComp.setAttribute('current', strNum);
                const miniIssueComp = document.getElementById('miniIssueSelectorComponent');
                if (miniIssueComp) miniIssueComp.setAttribute('current', strNum);

                const issueArticles = allArticles.filter(a => a.numero === strNum);
                
                const groups = {};
                issueArticles.forEach(art => {
                    const key = `${titleText} | Página ${art.pagina}`;
                    if (!groups[key]) groups[key] = [];
                    groups[key].push(art);
                });

                Object.keys(groups).forEach((key, index) => {
                    const arts = groups[key];
                    const accordion = document.createElement('app-accordion');
                    accordion.setAttribute('header-text', key);
                    if (index === 0) accordion.setAttribute('open', '');

                    let articlesHtml = '';

                    arts.forEach((art, i) => {
                        let bodyContent = art.contenido;
                        let subtitleHtml = '';
                        
                        const paragraphs = bodyContent.split('\n\n').filter(p => p.trim());
                        if (paragraphs.length > 0 && paragraphs[0].startsWith('*') && paragraphs[0].endsWith('*')) {
                            const subtitleText = paragraphs.shift().replace(/^\*|\*$/g, '');
                            subtitleHtml = `<h4 class="art-subtitle">${subtitleText}</h4>`;
                            bodyContent = paragraphs.join('\n\n');
                        }

                        const pdfUrl = `./pdf/N_Refractor_${strNum}.pdf#page=${art.pagina}`;
                        const authorObj = pubData.autores.find(a => a.id === art.autor_id);
                        const authorName = authorObj ? authorObj.nombre : art.autor;

                        articlesHtml += `
                            <article class="pub-article">
                                <h3 class="art-title">${art.titulo}</h3>
                                ${subtitleHtml}
                                <div class="art-body">
                                    ${bodyContent.split('\n\n').map(p => {
                                        const cleanP = p.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                                                        .replace(/\*(.*?)\*/g, '<em>$1</em>');
                                        return `<p class="art-paragraph">${cleanP}</p>`;
                                    }).join('')}
                                </div>
                                <div class="art-signature">
                                    ${index === 0 && i === 0 && authorName === 'Victor Nero' ? '<p class="art-signature-intro">por los refractarios,</p>' : ''}
                                    <p class="art-signature-name"><strong>${authorName}${art.lugar_fecha_publicacion ? `, ${art.lugar_fecha_publicacion.split(',')[0].trim()}` : ''}</strong></p>
                                    <p class="art-signature-date">${art.lugar_fecha_publicacion && art.lugar_fecha_publicacion.includes(',') ? art.lugar_fecha_publicacion.split(',')[1].trim() : ''}</p>
                                </div>
                                <div class="art-tag-footer">
                                    <div class="author-tag">Refractor ${strNum}</div>
                                    <div class="author-tag">${authorName}</div>
                                    <button class="btn-text-red btn-ver-pdf" data-url="${pdfUrl}">
                                        Ver artículo en PDF 
                                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                            <circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                                        </svg>
                                    </button>
                                </div>
                            </article>
                            ${i < arts.length - 1 ? '<div class="articles-separator"></div>' : ''}
                        `;
                    });

                    accordion.innerHTML = articlesHtml;
                    accordionContainer.appendChild(accordion);

                    // Add PDF listeners for articles inside this accordion
                    const btnsPdf = accordion.querySelectorAll('.btn-ver-pdf');
                    btnsPdf.forEach(btn => {
                        btn.addEventListener('click', (e) => {
                            viewer.open(e.currentTarget.dataset.url);
                        });
                    });
                });

                // Attach main viewer interactions
                const defaultPdf = `./pdf/N_Refractor_${strNum}.pdf`;

                const mainThumb = document.getElementById('mainThumbWrapper');
                if (mainThumb) {
                    mainThumb.addEventListener('click', () => viewer.open(defaultPdf));
                }

                const miniThumb = document.getElementById('miniThumbWrapper');
                if (miniThumb) {
                    miniThumb.addEventListener('click', () => viewer.open(defaultPdf));
                }

                const btnMainDetail = document.getElementById('btnMainDetail');
                if (btnMainDetail) {
                    btnMainDetail.addEventListener('click', () => viewer.open(defaultPdf));
                }

                const btnMiniDetail = document.getElementById('btnMiniDetail');
                if (btnMiniDetail) {
                    btnMiniDetail.addEventListener('click', () => viewer.open(defaultPdf));
                }

            } catch (error) {
                console.error("Error loading ficha data:", error);
                document.getElementById('fichaTitle').textContent = 'Error al cargar';
                document.getElementById('fichaSubtitle').textContent = 'Verifique la consola para más detalles.';
            }
        });
    </script>
</body>
</html>
