<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Archivo Blindado - Ficha de Número</title>
    <link rel="stylesheet" href="./styles.css?v=6">
</head>
<body>
    <div class="site-wrapper">
        <app-header></app-header>

        <main class="main-content">
            <!-- SECCIÓN HERO -->
            <section class="hero-ficha">
                <div class="hero-brand">
                    <img src="./images/Vector.svg" alt="REFRACTOR" class="hero-logo-img">
                    <div class="hero-date">1998 • 2000</div>
                </div>

                <div class="hero-nav">
                    <!-- Botón Independiente: Flecha -->
                    <a href="./index.html" class="hero-nav-btn hero-nav-item">
                        <img src="./images/ico_arrow-narrow-left.svg" alt="" class="hero-nav-icon">
                    </a>

                    <!-- Grupo de 2 Botones: Anterior y Siguiente -->
                    <div class="hero-nav-group">
                        <button class="hero-nav-btn">Anterior</button>
                        <button class="hero-nav-btn">Siguiente</button>
                    </div>

                    <!-- Botón Independiente: Selector -->
                    <issue-selector current="01"></issue-selector>
                </div>
            </section>

            <!-- SECCIÓN FICHA -->
            <section class="section-ficha">
                <div class="container container-ficha">
                    <div class="ficha-row">
                        <!-- Portada de la publicación -->
                        <div class="ficha-col-image">
                            <div class="pub-card-ficha">
                                <img src="./images/Placeholder Refractor.jpg" alt="REFRACTOR 01" class="pub-cover-ficha">
                                <img src="./images/Onmouse_2.svg" alt="" class="pub-hover-icon-ficha">
                            </div>
                        </div>

                        <!-- Información de la ficha -->
                        <div class="ficha-col-info">
                            <div class="ficha-content-block">
                                <h1 class="ficha-title">REFRACTOR 01</h1>
                                <p class="ficha-subtitle">14 de marzo de 1998 • 400 pts. • Tirada: 1.500 ejemplares</p>
                                
                                <div class="ficha-actions-row">
                                    <button class="btn-ficha-outline">
                                        Ver detalle
                                        <svg class="btn-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M17.5 17.5L13.875 13.875M9.16667 6.66667V11.6667M6.66667 9.16667H11.6667M15.8333 9.16667C15.8333 12.8486 12.8486 15.8333 9.16667 15.8333C5.48477 15.8333 2.5 12.8486 2.5 9.16667C2.5 5.48477 5.48477 2.5 9.16667 2.5C12.8486 2.5 15.8333 5.48477 15.8333 9.16667Z" stroke="currentColor" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </button>
                                    <download-dropdown text="Descargar" btn-class="btn-ficha-red"></download-dropdown>
                                </div>

                                <div class="ficha-pages-preview">
                                    <div class="page-preview-box">
                                        <span class="preview-num">1</span>
                                        <svg class="preview-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M17.5 17.5L13.875 13.875M9.16667 6.66667V11.6667M6.66667 9.16667H11.6667M15.8333 9.16667C15.8333 12.8486 12.8486 15.8333 9.16667 15.8333C5.48477 15.8333 2.5 12.8486 2.5 9.16667C2.5 5.48477 5.48477 2.5 9.16667 2.5C12.8486 2.5 15.8333 5.48477 15.8333 9.16667Z" stroke="currentColor" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </div>
                                    <div class="page-preview-box">
                                        <span class="preview-num">2</span>
                                        <svg class="preview-icon" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path d="M17.5 17.5L13.875 13.875M9.16667 6.66667V11.6667M6.66667 9.16667H11.6667M15.8333 9.16667C15.8333 12.8486 12.8486 15.8333 9.16667 15.8333C5.48477 15.8333 2.5 12.8486 2.5 9.16667C2.5 5.48477 5.48477 2.5 9.16667 2.5C12.8486 2.5 15.8333 5.48477 15.8333 9.16667Z" stroke="currentColor" stroke-width="1.66667" stroke-linecap="round" stroke-linejoin="round"/>
                                        </svg>
                                    </div>
                                </div>

                                <div class="ficha-bottom-meta">
                                    1 página • Tamaño: 135 x 124 cm.
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- SECCIÓN ARTÍCULOS -->
            <section class="placeholder-section placeholder-articulos">
                ARTÍCULOS (DIVIDIDOS POR PÁGINAS)
            </section>

            <!-- SECCIÓN MINIFICHA -->
            <section class="placeholder-section placeholder-minificha">
                MINIFICHA
            </section>
        </main>

        <app-quote 
            text="Todo pasa, la nada quedará, la nada creadora. Los refractarios vamos a por el todo porque no aspiramos a nada." 
            highlight="¡Para otros la revolución!"
            text-post="Para nosotros la gimnasia revolucionaria. El futuro se ve tan negro que nadie duda que será nuestro."
            author="Victor Nero">
        </app-quote>

        <app-footer></app-footer>
    </div> <!-- End site-wrapper -->

    <script src="./js/components.js"></script>
</body>
</html>
